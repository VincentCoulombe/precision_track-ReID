# ================================
# General on/off options
# ================================
train: true
test: true
deploy: true

# ================================
# Classification parameters
# ================================
num_classes: 5

# ================================
# General directories and paths
# ================================
dataset_directory: "../../datasets/stripedmice/mot_v2/"
metadata: "re_id_mapping.json"

save_directory: "../work_dir/training_runs/"

# ================================
# Crop confidence filter (optional)
# ================================
detector_checkpoint: "../../precision_track/checkpoints/stripedmice/model_stripedmice_DEPLOYED.onnx"
confidence_threshold: 0.75
bbox_enlargement: 0.5

# ================================
# Training parameters
# ================================
backbone_name: "dinov3-convnext"
freeze_backbone: false
batch_size: 24
epochs: 200
val_split: 0.2
seed: 42
